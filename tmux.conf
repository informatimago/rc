# -*- mode:conf; -*-
#
# tmux configuration, converted from ~/rc/screenrc (GNU screen 4.00.03).
#
# The sections follow screenrc in order.  Each screen setting is either
# translated, or marked as built into tmux, or marked as having no tmux
# equivalent.  screen default behaviours that tmux does not share (key
# bindings, fixed window titles, copy mode) are reproduced as well, so
# the session feels the same.
#
# Needs tmux 3.2 or later (terminal-features, {} command blocks).
#

# no annoying audible bell, please                       (vbell on)
set -g visual-bell on

# detach on hangup                                       (autodetach on)
# -- built in: a tmux session always survives the loss of its terminal.

# don't display the copyright page                       (startup_message off)
# -- built in: tmux has no startup message.

# emulate .logout message                                (pow_detach_msg)
# -- see the C-z D D binding (pow_detach) below.

# make the shell in every window a login shell           (shell -$SHELL)
# -- built in: with an empty default-command (the default), tmux runs
#    default-shell (which defaults to $SHELL) as a login shell.

set -g history-limit 50000                             # defscrollback 50000


################
#
# screen behaviours that tmux does not have by default
#

# Window titles stay fixed (screen -t, C-z A), but programs may still
# set them with \ek...\e\\ as in screen.
set -g automatic-rename off
set -g allow-rename on

# Messages stay up as long as with screen's msgwait (5 s); any key
# clears them.
set -g display-time 5000

# Show "Activity in window N" for monitored windows (C-z M).
set -g visual-activity on


################
#
# xterm tweaks
#

set -g default-terminal "screen-256color"              # term screen-256color

# attrcolor b ".I" (bright colours for bold text)
# -- no tmux equivalent; terminal emulators do it themselves.

# termcapinfo xterm 'Co#256:AB=...:AF=...': the outer xterm has 256 colours.
set -as terminal-features ',xterm:256'

# defbce on
# -- built in: tmux always erases with the current background colour.

# defutf8 on / defencoding UTF-8
# -- built in: tmux is always UTF-8 inside.  It uses UTF-8 with the
#    outer terminal when LANG/LC_CTYPE/LC_ALL names a UTF-8 locale (or
#    when started with tmux -u).

# termcap/terminfo xterm hs@:cs=...:im=...:ei=...
# -- not needed: tmux uses no status line capability nor insert mode,
#    and xterm's csr is already that one.

# termcapinfo xterm Z0=...:Z1=... and is=... (80/132 column switching)
# -- no equivalent: tmux has no C-a W (width), and never sends is2.

# termcapinfo xterm* OL=10000 (output buffer size)
# -- no equivalent.

# termcapinfo xterm 'VR=\E[?5h:VN=\E[?5l' (flash for the visual bell)
# -- no equivalent: tmux's visual bell is a message, not a flash.

# termcapinfo xterm 'k1=...:k4=...' and 'kh=...:kN=...' (function keys)
# kP=\E[H is left out: \E[H is xterm's Home key, and mapping it to Prior
# (Page Up) is most probably a typo in the screen example this screenrc
# comes from.
set -as terminal-overrides ',xterm:kf1=\E[11~:kf2=\E[12~:kf3=\E[13~:kf4=\E[14~'
set -as terminal-overrides ',xterm:khome=\E[1~:kich1=\E[2~:kdch1=\E[3~:kend=\E[4~:knp=\E[6~'

# termcapinfo xterm 'hs:ts=\E]2;:fs=\007:ds=\E]2;screen\007'
# -- not needed: like screen with hardstatus alwayslastline, tmux keeps
#    its status on the last line and leaves the xterm title alone
#    (set-titles off).

# termcapinfo xterm 'vi=\E[?25l:ve=\E[34h\E[?25h:vs=\E[34l' (cursor visibility)
set -as terminal-overrides ',xterm:civis=\E[?25l:cnorm=\E[34h\E[?25h:cvvis=\E[34l'

# termcapinfo xterm 'XC=K%,...' (emulate part of the 'K' charset)
# -- no equivalent.

# termcapinfo xterm ut (xterm-52 erases with the background colour)
set -as terminal-overrides ',xterm:bce'


################
#
# wyse terminals
#

# termcapinfo wy75-42 xo:hs@ (xon/xoff flow control)
# -- no equivalent: tmux does no flow control.

# termcapinfo wy* CS=...:CE=...:vi=...:ve=...:VR=...:VN=...:cb=...:CD=...
# -- only vi, ve and cb translate; tmux does not use the others.
set -as terminal-overrides ',wy*:civis=\E[?25l:cnorm=\E[?25h:el1=\E[1K'


################
#
# other terminals
#

# termcapinfo hp700 'Z0=...:Z1=...:hs:ts=...:fs=...:ds=...:ic@'
# -- only ic@ translates (no insert-character); see xterm for the rest.
set -as terminal-overrides ',hp700:ich1@'

# Extend the vt100 description by some sequences.        (termcap/terminfo vt100*)
set -as terminal-overrides ',vt100*:il=\E[%p1%dL:dl=\E[%p1%dM:cuu=\E[%p1%dA:cud=\E[%p1%dB:cub=\E[%p1%dD:cuf=\E[%p1%dC'


################
#
# keybindings
#

# escape ^z^z: C-z is the command character, C-z C-z sends a literal C-z.
unbind C-b
set -g prefix C-z
bind C-z send-prefix

# screen's default bindings, where tmux has none or a different one.
# The keys on which screen and tmux agree (0-9 ' : ? [ ] c d i n p) are
# left alone; so are tmux's own extra keys.
bind C-c new-window                                    # screen
bind C-d detach-client                                 # detach
bind C-n next-window                                   # next
bind Space next-window
bind C-p previous-window                               # prev
bind BSpace previous-window
bind A command-prompt -I "#W" -p "Set window's title to:" { rename-window -- "%%" }
bind '"' choose-tree -Zw                               # windowlist -b
bind w display-message "#{W:#I#F #W  }"                # windows
bind C-w display-message "#{W:#I#F #W  }"
bind N display-message "This is window #I (#W)."      # number
bind Tab select-pane -t :.+                            # focus
bind S split-window -v                                 # split (with a new shell)
bind Q resize-pane -Z                                  # only (zoom: kills nothing)
bind X break-pane -d                                   # remove (the pane goes to its own window)
bind l refresh-client                                  # redisplay
bind C-l refresh-client
bind z suspend-client                                  # suspend
bind Z send-keys -R                                    # reset
bind Escape copy-mode                                  # copy (C-z C-[, C-z Esc)
bind '*' list-clients                                  # displays
bind M set -w monitor-activity \; display-message "Window #I (#W) is #{?monitor-activity,now being monitored for all activity,no longer being monitored for activity}."
bind H pipe-pane -o 'cat >>"$HOME/screenlog.#I"' \; display-message '#{?pane_pipe,Creating logfile "screenlog.#I".,Logfile "screenlog.#I" closed.}'

# pow_detach (C-z D D): detach, print the pow_detach_msg message, and
# hang up the parent shell, so that the terminal session logs out.
bind D switch-client -T pow-detach
bind -T pow-detach D detach-client -E 'printf "tmux session of %s \nended.\n" "$LOGNAME"; kill -HUP $PPID'

#remove some stupid / dangerous key bindings
unbind k                                               # screen: kill
unbind C-k                                             # screen: kill
unbind .                                               # screen: dumptermcap (tmux: move-window)
unbind 'C-\'                                           # screen: quit
unbind '\'                                             # screen: quit
unbind C-h                                             # screen: prev
unbind h                                               # screen: hardcopy
# tmux's own kill keys: same reasoning as k above (they ask for
# confirmation, like screen's C-a k did).
unbind x                                               # tmux: kill-pane
unbind '&'                                             # tmux: kill-window
#make them better
bind K confirm-before -p "Really kill this window [y/n]" kill-window
# bind 'I' login on / bind 'O' login off
# -- no equivalent: tmux does not manage utmp login slots.
# bind '}' history
# -- no equivalent (tmux's own } swap-pane -D is kept).
bind o select-pane -t :.+                              # focus

# Yet another hack:
# Wrap the paste with ":se noai" / ":se ai" if ^z^] is pressed.
# This lets me have autoindent mode in vi.               (register [ ] + paste [.])
bind C-] {
    send-keys Escape ":se noai" Enter a
    paste-buffer
    send-keys Escape ":se ai" Enter a
}


################
#
# copy mode
#

# screen's copy mode is vi-like, and the first Space (or Return) sets
# the mark, the second copies and leaves copy mode.  Esc aborts.
set -g mode-keys vi
bind -T copy-mode-vi Space if -F '#{selection_present}' { send -X copy-selection-and-cancel } { send -X begin-selection }
bind -T copy-mode-vi Enter if -F '#{selection_present}' { send -X copy-selection-and-cancel } { send -X begin-selection }
bind -T copy-mode-vi Escape send -X cancel


################
#
# default windows
#

# screen -t root 0 ... screen -t mov 5
# screen opens these windows in every new session; so does this hook.
# A session added to an existing group shares that group's windows,
# so the hook skips it.
set-hook -g session-created {
    if -F '#{==:#{session_grouped},0}' {
        rename-window -t :0 root
        new-window -t :1 -n loc
        new-window -t :2 -n kui
        new-window -t :3 -n hub
        new-window -t :4 -n lar
        new-window -t :5 -n mov
    }
}


################
#
# hardstatus
#

# hardstatus on / hardstatus alwayslastline, with the green string:
#   "%{.gw}%-w%{.rw}%n %t%{-}%+w %=%{..b}%H%{..r}%l%{..b}%m-%d %c"
# screen colours are "background foreground" pairs, so: white on green,
# the current window white on red, then hostname (blue), load averages
# (red) and month-day hour:minute (blue), with no separators in between,
# as in screen.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=green,fg=white"                # %{.gw}
set -g status-left ""
set -g window-status-separator "  "
set -g window-status-format "#I#F #W"                  # %-w and %+w entries
set -g window-status-current-format "#I #W"            # %n %t
set -g window-status-current-style "bg=red,fg=white"   # %{.rw}
set -g status-right-length 80
set -g status-right "#[fg=blue]#h#[fg=red]#(LC_ALL=C uptime | sed -e 's/.*load averages*: //' -e 's/,//g')#[fg=blue]%m-%d %H:%M"

# The other hardstatus strings of screenrc, should they be wanted:
#   Blue (escape ^^^^):   prefix C-^, status-style "bg=blue,fg=brightwhite",
#                         window-status-current-style "bg=red,fg=brightwhite",
#                         hostname and date fg=brightgreen.
#   Yellow (escape ^_^_): prefix C-_, status-style "bg=yellow,fg=brightblue",
#                         window-status-current-style "bg=red,fg=brightblue",
#                         hostname and date fg=blue.
